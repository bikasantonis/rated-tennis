name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze & Build Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-3.38.5

      - name: Setup Flutter
        run: |
          if [ ! -d /opt/flutter/bin ]; then
            git clone https://github.com/flutter/flutter.git --depth 1 -b 3.38.5 /opt/flutter
          fi
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Write dart-defines file
        run: |
          cat <<EOF > dart_defines.json
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "SENTRY_DSN": "${{ secrets.SENTRY_DSN }}",
            "APP_ENV": "ci",
            "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
            "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}"
          }
          EOF

      - name: Build web
        run: flutter build web --dart-define-from-file=dart_defines.json

      - name: Run tests
        run: flutter test
