<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844"
     font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="card-shadow" x="-4%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1A1A2E" flood-opacity="0.08"/>
    </filter>
    <filter id="fab-shadow" x="-8%" y="-8%" width="116%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#006EA7" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sparkline-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006EA7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#006EA7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════
       BACKGROUND
  ══════════════════════════════════════════════ -->
  <rect width="390" height="844" fill="#F4F7FC"/>

  <!-- ══════════════════════════════════════════════
       STATUS BAR  y=0–44
  ══════════════════════════════════════════════ -->
  <rect width="390" height="44" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="15" font-weight="600" fill="#1A1A2E">9:41</text>

  <!-- Signal bars -->
  <rect x="308" y="25" width="3" height="8"  rx="0.8" fill="#1A1A2E" opacity="0.9"/>
  <rect x="313" y="22" width="3" height="11" rx="0.8" fill="#1A1A2E" opacity="0.9"/>
  <rect x="318" y="19" width="3" height="14" rx="0.8" fill="#1A1A2E" opacity="0.9"/>

  <!-- WiFi -->
  <path d="M331 30 Q335 24 339 30" fill="none" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M328 33 Q335 21 342 33" fill="none" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="335" cy="32" r="1.8" fill="#1A1A2E" opacity="0.9"/>

  <!-- Battery -->
  <rect x="349" y="18" width="28" height="13" rx="2.5" fill="none" stroke="#1A1A2E" stroke-width="1.5" opacity="0.9"/>
  <rect x="377" y="22" width="3" height="5" rx="1" fill="#1A1A2E" opacity="0.6"/>
  <rect x="350.5" y="19.5" width="22" height="10" rx="1.5" fill="#1A1A2E" opacity="0.9"/>

  <!-- ══════════════════════════════════════════════
       APP BAR  y=44–108
  ══════════════════════════════════════════════ -->
  <rect x="0" y="44" width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="108" x2="390" y2="108" stroke="#E3ECF5" stroke-width="0.5"/>

  <text x="20" y="84" font-size="22" font-weight="600" fill="#1A1A2E"
        font-family="'IBM Plex Sans', system-ui, sans-serif">Home</text>

  <!-- Notifications bell (icon center x=258, y=76) -->
  <g transform="translate(246,64)" fill="none" stroke="#1A1A2E" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M12 3a6 6 0 0 0-6 6v3.5L4 15h16l-2-2.5V9a6 6 0 0 0-6-6z"/>
    <path d="M10 18a2 2 0 0 0 4 0"/>
  </g>
  <!-- Notification badge (2 unread) -->
  <circle cx="269" cy="67" r="7" fill="#BA1A1A"/>
  <text x="269" y="71" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Person icon (icon center x=306, y=76) -->
  <g transform="translate(294,64)" fill="none" stroke="#1A1A2E" stroke-width="1.7"
     stroke-linecap="round" opacity="0.75">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </g>

  <!-- Settings icon (icon center x=354, y=76) -->
  <g transform="translate(342,64)" fill="none" stroke="#1A1A2E" stroke-width="1.6"
     stroke-linecap="round" opacity="0.75">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v2M12 20v2M2 12H4M20 12h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 19.1l1.4-1.4M13.7 10.3l1.4-1.4"/>
  </g>

  <!-- ══════════════════════════════════════════════
       ELO SCORE CARD  y=124–448  (324px tall)
  ══════════════════════════════════════════════ -->
  <rect x="16" y="124" width="358" height="324" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>

  <!-- ELO score number -->
  <text x="40" y="220" font-size="72" font-weight="700" fill="#006EA7"
        font-family="'Barlow Condensed', system-ui, sans-serif">7.2</text>

  <!-- Win streak badge (🔥 3) — top right of card inner area -->
  <rect x="292" y="150" width="58" height="26" rx="999"
        fill="#FF6B00" fill-opacity="0.12"
        stroke="#FF6B00" stroke-opacity="0.42" stroke-width="1"/>
  <text x="308" y="168" font-size="14">🔥</text>
  <text x="326" y="168" font-size="13" font-weight="700" fill="#FF6B00">3</text>

  <!-- Tier badge "7.0" -->
  <rect x="40" y="230" width="44" height="22" rx="999" fill="#7B8D9A"/>
  <text x="62" y="245" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7.0</text>

  <!-- Stats row: Played | Won | Win % -->
  <text x="102"  y="285" font-size="18" font-weight="600" fill="#1A1A2E" text-anchor="middle">24</text>
  <text x="102"  y="301" font-size="12" fill="#8AAAC8" text-anchor="middle">Played</text>
  <text x="195"  y="285" font-size="18" font-weight="600" fill="#1A1A2E" text-anchor="middle">16</text>
  <text x="195"  y="301" font-size="12" fill="#8AAAC8" text-anchor="middle">Won</text>
  <text x="288"  y="285" font-size="18" font-weight="600" fill="#1A1A2E" text-anchor="middle">67%</text>
  <text x="288"  y="301" font-size="12" fill="#8AAAC8" text-anchor="middle">Win %</text>

  <!-- Divider -->
  <line x1="40" y1="320" x2="350" y2="320" stroke="#E3ECF5" stroke-width="1"/>

  <!-- Sparkline — trending up (ELO history) -->
  <path d="M 40,374 L 101,362 L 162,369 L 223,350 L 285,344 L 350,334"
        fill="none" stroke="#006EA7" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkline area fill -->
  <path d="M 40,382 L 40,374 L 101,362 L 162,369 L 223,350 L 285,344 L 350,334 L 350,382 Z"
        fill="url(#sparkline-area)"/>
  <!-- End dot -->
  <circle cx="350" cy="334" r="3.5" fill="#006EA7"/>

  <!-- Tier progress bar -->
  <!-- Left tier badge "7.0" -->
  <rect x="40" y="398" width="32" height="18" rx="999" fill="#7B8D9A"/>
  <text x="56" y="411" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">7.0</text>
  <!-- Track -->
  <rect x="78" y="404" width="224" height="6" rx="12" fill="#006EA7" fill-opacity="0.12"/>
  <!-- Fill (68% → 152px) -->
  <rect x="78" y="404" width="152" height="6" rx="12" fill="#006EA7"/>
  <!-- Right tier badge "7.5" -->
  <rect x="308" y="398" width="32" height="18" rx="999" fill="#A0A8B0"/>
  <text x="324" y="411" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">7.5</text>

  <!-- ══════════════════════════════════════════════
       RECENT MATCHES SECTION HEADER  y≈472
  ══════════════════════════════════════════════ -->
  <text x="16" y="488" font-size="16" font-weight="600" fill="#006EA7">Recent matches</text>

  <!-- ══════════════════════════════════════════════
       MATCH TILE 1 — WIN  y=496
  ══════════════════════════════════════════════ -->
  <rect x="16" y="496" width="358" height="72" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <!-- Avatar: win (green) -->
  <circle cx="56" cy="532" r="20" fill="#2D6A4F" fill-opacity="0.14"/>
  <text x="56" y="538" font-size="17" text-anchor="middle">🏆</text>
  <!-- Content -->
  <text x="88" y="524" font-size="14" font-weight="500" fill="#1A1A2E">Won vs Alex Müller</text>
  <text x="88" y="542" font-size="12" fill="#8AAAC8">6–4, 7–5</text>
  <!-- ELO delta + date -->
  <text x="350" y="524" font-size="13" font-weight="700" fill="#2D6A4F" text-anchor="end">+2.3</text>
  <text x="350" y="541" font-size="11" fill="#8AAAC8" text-anchor="end">19/5/2026</text>

  <!-- ══════════════════════════════════════════════
       MATCH TILE 2 — LOSS  y=576
  ══════════════════════════════════════════════ -->
  <rect x="16" y="576" width="358" height="72" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <!-- Avatar: loss (clay) -->
  <circle cx="56" cy="612" r="20" fill="#C1440E" fill-opacity="0.14"/>
  <text x="56" y="618" font-size="17" text-anchor="middle">🎾</text>
  <!-- Content -->
  <text x="88" y="604" font-size="14" font-weight="500" fill="#1A1A2E">Lost vs Jordan Kim</text>
  <text x="88" y="622" font-size="12" fill="#8AAAC8">3–6, 4–6</text>
  <!-- ELO delta + date -->
  <text x="350" y="604" font-size="13" font-weight="700" fill="#C1440E" text-anchor="end">–1.8</text>
  <text x="350" y="621" font-size="11" fill="#8AAAC8" text-anchor="end">15/5/2026</text>

  <!-- ══════════════════════════════════════════════
       MATCH TILE 3 — WIN  y=656
  ══════════════════════════════════════════════ -->
  <rect x="16" y="656" width="358" height="72" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <circle cx="56" cy="692" r="20" fill="#2D6A4F" fill-opacity="0.14"/>
  <text x="56" y="698" font-size="17" text-anchor="middle">🏆</text>
  <text x="88" y="684" font-size="14" font-weight="500" fill="#1A1A2E">Won vs Maria Santos</text>
  <text x="88" y="702" font-size="12" fill="#8AAAC8">6–2, 6–3</text>
  <text x="350" y="684" font-size="13" font-weight="700" fill="#2D6A4F" text-anchor="end">+3.1</text>
  <text x="350" y="701" font-size="11" fill="#8AAAC8" text-anchor="end">10/5/2026</text>

  <!-- ══════════════════════════════════════════════
       FLOATING ACTION BUTTONS  y=694
       Both use AO Blue (#006EA7). Overlap tiles; ListView
       has bottom padding 80 to keep content clear.
  ══════════════════════════════════════════════ -->
  <!-- Challenge FAB — Positioned(bottom:16, left:16) inside body Stack -->
  <rect x="16" y="694" width="130" height="48" rx="16" fill="#006EA7" filter="url(#fab-shadow)"/>
  <text x="38" y="723" font-size="16">🎾</text>
  <text x="62" y="723" font-size="14" font-weight="600" fill="#FFFFFF">Challenge</text>

  <!-- Submit Match FAB — Scaffold floatingActionButton (bottom-right) -->
  <rect x="222" y="694" width="156" height="48" rx="16" fill="#006EA7" filter="url(#fab-shadow)"/>
  <!-- Plus icon -->
  <line x1="244" y1="718" x2="256" y2="718" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="250" y1="712" x2="250" y2="724" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="264" y="723" font-size="14" font-weight="600" fill="#FFFFFF">Submit match</text>

  <!-- ══════════════════════════════════════════════
       BOTTOM NAVIGATION BAR  y=756–844
       Visible nav content: y=756–810 (54px)
       System safe area: y=810–844 (34px)
  ══════════════════════════════════════════════ -->
  <rect x="0" y="756" width="390" height="88" fill="#FFFFFF"/>
  <line x1="0" y1="756" x2="390" y2="756" stroke="#E3ECF5" stroke-width="0.5"/>

  <!-- ── Tab 0: HOME — selected (AO Blue pill, AO Yellow icon+label) -->
  <!-- Item span: x=0–97.5, center x=48.75 -->
  <rect x="12" y="760" width="74" height="50" rx="14" fill="#006EA7"/>
  <!-- House icon (simplified) -->
  <g transform="translate(37,769)" fill="#F4C430">
    <polygon points="12,2 2,11 5,11 5,21 10,21 10,16 14,16 14,21 19,21 19,11 22,11"/>
  </g>
  <text x="49" y="806" font-size="11" font-weight="700" fill="#F4C430" text-anchor="middle">Home</text>

  <!-- ── Tab 1: LEADERBOARD — unselected -->
  <!-- Item span: x=97.5–195, center x=146.25 -->
  <g transform="translate(134,770)" fill="#8AAAC8">
    <rect x="0" y="9"  width="4" height="8"  rx="1"/>
    <rect x="7" y="5"  width="4" height="12" rx="1"/>
    <rect x="14" y="1" width="4" height="16" rx="1"/>
  </g>
  <text x="146" y="806" font-size="11" font-weight="400" fill="#8AAAC8" text-anchor="middle">Leaderboard</text>

  <!-- ── Tab 2: MATCHES — unselected (badge: 2 pending) -->
  <!-- Item span: x=195–292.5, center x=243.75 -->
  <g transform="translate(232,770)" fill="none" stroke="#8AAAC8" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="22" height="16" rx="2"/>
    <polyline points="1,8 12,15 23,8"/>
  </g>
  <!-- Inbox badge -->
  <circle cx="262" cy="772" r="7.5" fill="#BA1A1A"/>
  <text x="262" y="776" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="244" y="806" font-size="11" font-weight="400" fill="#8AAAC8" text-anchor="middle">Matches</text>

  <!-- ── Tab 3: TOURNAMENTS — unselected -->
  <!-- Item span: x=292.5–390, center x=341.25 -->
  <g transform="translate(329,769)" fill="#8AAAC8">
    <!-- Simplified trophy / star -->
    <path d="M12 2l2.4 7H22l-6 4.4 2.3 7.1L12 17l-6.3 3.5L8 13.4 2 9h7.6z"/>
  </g>
  <text x="341" y="806" font-size="11" font-weight="400" fill="#8AAAC8" text-anchor="middle">Tournaments</text>

  <!-- Safe area home indicator -->
  <rect x="160" y="830" width="70" height="5" rx="2.5" fill="#1A1A2E" opacity="0.18"/>

  <!-- ══════════════════════════════════════════════
       ANNOTATION LAYER — spacing + sizing guides
       (light; easy to hide in Figma via layer toggle)
  ══════════════════════════════════════════════ -->
  <!-- Card horizontal padding guide -->
  <line x1="0" y1="124" x2="16" y2="124" stroke="#006EA7" stroke-width="0.5" opacity="0.4" stroke-dasharray="3 2"/>
  <line x1="374" y1="124" x2="390" y2="124" stroke="#006EA7" stroke-width="0.5" opacity="0.4" stroke-dasharray="3 2"/>

  <!-- Right-side dimension labels -->
  <!-- 44px status bar -->
  <line x1="384" y1="0"   x2="384" y2="44"  stroke="#8AAAC8" stroke-width="0.5" opacity="0.5"/>
  <text x="388" y="25"  font-size="8" fill="#8AAAC8" opacity="0.7">44</text>
  <!-- 64px app bar -->
  <line x1="384" y1="44"  x2="384" y2="108" stroke="#8AAAC8" stroke-width="0.5" opacity="0.5"/>
  <text x="388" y="79"  font-size="8" fill="#8AAAC8" opacity="0.7">64</text>
  <!-- 16px content padding -->
  <line x1="384" y1="108" x2="384" y2="124" stroke="#8AAAC8" stroke-width="0.5" opacity="0.5"/>
  <text x="388" y="118" font-size="8" fill="#8AAAC8" opacity="0.7">16</text>
  <!-- card 324px -->
  <line x1="384" y1="124" x2="384" y2="448" stroke="#8AAAC8" stroke-width="0.5" opacity="0.5"/>
  <text x="388" y="288" font-size="8" fill="#8AAAC8" opacity="0.7">324</text>
  <!-- 88px nav bar -->
  <line x1="384" y1="756" x2="384" y2="844" stroke="#8AAAC8" stroke-width="0.5" opacity="0.5"/>
  <text x="388" y="803" font-size="8" fill="#8AAAC8" opacity="0.7">88</text>

</svg>
